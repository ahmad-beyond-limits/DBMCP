services:
  postgres:
    image: postgres:16-alpine
    container_name: dbmcp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: dbmcp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dbmcp_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/dbmcp
      PORT: 8000
      SECRET_KEY: dev-docker-secret-key-32bytesmin-for-security
      JWT_SECRET_KEY: dev-docker-jwt-key-32bytesmin-for-security
      WORKSPACE_HASH_SECRET: dev-docker-workspace-hash-key-32bytesmin
      MCP_TOKEN_SECRET: dev-docker-mcp-token-key-32bytesmin
      MCP_SESSION_SECRET: dev-docker-mcp-session-key-32bytesmin
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dbmcp_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

volumes:
  postgres_data:
  backend_uploads:
